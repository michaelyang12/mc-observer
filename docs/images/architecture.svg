<svg xmlns="http://www.w3.org/2000/svg" width="960" height="352" viewBox="0 0 960 352" role="img" aria-label="Pipeline from server events to validated RCON commands">
<title>Pipeline from server events to validated RCON commands</title>
<clipPath id="round"><rect width="960" height="352" rx="14"/></clipPath>
<g clip-path="url(#round)">
<rect width="960" height="352" fill="#1E2128"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B5"/></marker></defs>
<text x="22" y="44" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F0F2F7">How a reply happens</text>
<text x="22" y="70" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9AA3B5">Plain Python, one process per server. The model only fills JSON fields; code decides which commands run.</text>
<rect x="22" y="110" width="134" height="92" rx="10" fill="#3B4252" stroke="#566074" stroke-width="1"/>
<text x="89.0" y="142" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F0F2F7">Minecraft server</text>
<text x="89.0" y="166" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C3C9D6">docker logs -f</text>
<text x="89.0" y="183" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C3C9D6">+ vitals every 45s</text>
<rect x="179" y="110" width="134" height="92" rx="10" fill="#3B4252" stroke="#566074" stroke-width="1"/>
<text x="246.0" y="142" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F0F2F7">Event log</text>
<text x="246.0" y="166" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C3C9D6">every event saved</text>
<text x="246.0" y="183" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C3C9D6">to memory.db</text>
<line x1="158" y1="156.0" x2="176" y2="156.0" stroke="#9AA3B5" stroke-width="2" marker-end="url(#arr)"/>
<rect x="336" y="110" width="134" height="92" rx="10" fill="#3B4252" stroke="#566074" stroke-width="1"/>
<text x="403.0" y="142" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F0F2F7">Gate</text>
<text x="403.0" y="166" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C3C9D6">worth a model</text>
<text x="403.0" y="183" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C3C9D6">call right now?</text>
<line x1="315" y1="156.0" x2="333" y2="156.0" stroke="#9AA3B5" stroke-width="2" marker-end="url(#arr)"/>
<rect x="493" y="110" width="134" height="92" rx="10" fill="#3B4252" stroke="#566074" stroke-width="1"/>
<text x="560.0" y="142" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F0F2F7">Prompt</text>
<text x="560.0" y="166" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C3C9D6">persona + memory</text>
<text x="560.0" y="183" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C3C9D6">+ recent log</text>
<line x1="472" y1="156.0" x2="490" y2="156.0" stroke="#9AA3B5" stroke-width="2" marker-end="url(#arr)"/>
<rect x="650" y="110" width="134" height="92" rx="10" fill="#4C3B6B" stroke="#566074" stroke-width="1"/>
<text x="717.0" y="142" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F0F2F7">claude -p</text>
<text x="717.0" y="166" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C3C9D6">one-shot, no tools,</text>
<text x="717.0" y="183" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C3C9D6">returns JSON</text>
<line x1="629" y1="156.0" x2="647" y2="156.0" stroke="#9AA3B5" stroke-width="2" marker-end="url(#arr)"/>
<rect x="807" y="110" width="134" height="92" rx="10" fill="#2F5A46" stroke="#566074" stroke-width="1"/>
<text x="874.0" y="142" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F0F2F7">Validator</text>
<text x="874.0" y="166" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C3C9D6">allowlists, clamps,</text>
<text x="874.0" y="183" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C3C9D6">cooldowns, budgets</text>
<line x1="786" y1="156.0" x2="804" y2="156.0" stroke="#9AA3B5" stroke-width="2" marker-end="url(#arr)"/>
<rect x="642" y="88" width="307" height="126" rx="14" fill="none" stroke="#E0B252" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="795.5" y="80" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E0B252">safety boundary</text>
<path d="M874.0,202 V272 H89.0 V206" fill="none" stroke="#7FBF9A" stroke-width="2" marker-end="url(#arr)"/>
<rect x="191.5" y="257" width="580" height="30" rx="15" fill="#1E2128"/>
<text x="481.5" y="277" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#A8E0BE">RCON: tellraw, give, summon, effect, lightning, time, weather</text>
<text x="22" y="324" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9AA3B5">On logoff, a separate review call summarizes the session and updates the persona's private impressions and memories.</text>
</g>
</svg>
